<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Receipt</title>
<style>
  /* Sized for 80mm thermal POS printers (72mm printable). For 58mm printers change --w to 48mm. */
  :root { --w: 72mm; }
  @page { size: 80mm auto; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e5e5; font: 12px/1.35 "Courier New", ui-monospace, monospace; color: #000; }
  .toolbar { display: flex; gap: .5rem; justify-content: center; padding: .7rem; font-family: system-ui, sans-serif; }
  .toolbar button { padding: .5rem 1rem; font-weight: 600; border-radius: 6px; border: 1px solid #aaa; background: #fff; cursor: pointer; }
  .toolbar button.primary { background: #c2410c; color: #fff; border-color: transparent; }
  .receipt { width: var(--w); margin: 0 auto 1rem; background: #fff; padding: 4mm 3mm 8mm; }
  .c { text-align: center; } .b { font-weight: bold; } .big { font-size: 15px; }
  hr { border: 0; border-top: 1px dashed #000; margin: 2mm 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .4mm 0; vertical-align: top; }
  td.r { text-align: right; white-space: nowrap; }
  .tot td { font-size: 14px; font-weight: bold; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .receipt { margin: 0; padding: 2mm 3mm 10mm; }
  }
</style>
</head>
<body>
<div class="toolbar"><button class="primary" id="printBtn">🖨 Print</button><button onclick="window.close()">Close</button></div>
<div class="receipt" id="r">Loading…</div>

<script src="/common.js"></script>
<script>
const id = location.pathname.split('/').pop();
const auto = new URLSearchParams(location.search).has('auto');
let printed = false;

async function main() {
  const cfg = await APP.loadConfig();
  const o = await APP.api('/api/staff/orders/' + id);
  if (!o.invoice) { document.getElementById('r').textContent = 'This order has not been invoiced yet.'; return; }
  const inv = o.invoice, e = APP.esc, m = (c) => APP.money(c);
  document.title = inv.invoice_no;
  document.getElementById('r').innerHTML = `
    <div class="c b big">${e(cfg.name)}</div>
    <div class="c">${e(cfg.address)}</div>
    ${cfg.phone ? `<div class="c">Tel: ${e(cfg.phone)}</div>` : ''}
    ${cfg.taxId ? `<div class="c">TIN: ${e(cfg.taxId)}</div>` : ''}
    <hr>
    <div class="c b">${inv.print_count ? 'RECEIPT (REPRINT)' : 'OFFICIAL RECEIPT'}</div>
    <table>
      <tr><td>Invoice</td><td class="r b">${e(inv.invoice_no)}</td></tr>
      <tr><td>Order</td><td class="r">${e(o.order_no)}</td></tr>
      <tr><td>Date</td><td class="r">${e(new Date(inv.issued_at).toLocaleString())}</td></tr>
      <tr><td>Customer</td><td class="r">${e(o.customer_name)}</td></tr>
      <tr><td>Type</td><td class="r">${o.order_type === 'dine-in' ? 'Dine-in · Table ' + e(o.table_no) : 'Takeout'}</td></tr>
    </table>
    <hr>
    <table>${o.items.map((i) => `
      <tr><td colspan="2">${e(i.name)}</td></tr>
      <tr><td>&nbsp;&nbsp;${i.qty} x ${m(i.unit_price_cents)}</td><td class="r">${m(i.line_total_cents)}</td></tr>`).join('')}
    </table>
    <hr>
    <table>
      <tr><td>Subtotal</td><td class="r">${m(inv.subtotal_cents)}</td></tr>
      <tr><td>Tax (${(inv.tax_rate * 100).toFixed(0)}%)</td><td class="r">${m(inv.tax_cents)}</td></tr>
      <tr class="tot"><td>TOTAL</td><td class="r">${m(inv.total_cents)}</td></tr>
      <tr><td>Payment</td><td class="r">${inv.payment_status === 'paid' ? 'PAID · ' + e(inv.payment_method.toUpperCase()) : 'UNPAID'}</td></tr>
    </table>
    <hr>
    <div class="c">Items: ${o.items.reduce((s, i) => s + i.qty, 0)}</div>
    <div class="c b" style="margin-top:2mm">Thank you! Please come again.</div>
    <div class="c" style="margin-top:2mm;font-size:10px">${e(new Date().toLocaleString())}</div>`;
  if (auto) setTimeout(doPrint, 300);
}

async function doPrint() {
  window.print();
  if (!printed) { printed = true; try { await APP.api(`/api/staff/orders/${id}/printed`, { method: 'POST' }); } catch {} }
}
document.getElementById('printBtn').onclick = () => { printed = false; doPrint(); };
main().catch((err) => document.getElementById('r').textContent = err.message);
</script>
</body>
</html>
